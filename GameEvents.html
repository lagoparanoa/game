  <script>
    let gameEvents = [];

    function eventPresentation(eventType) {
      const type = String(eventType || 'INFO').toUpperCase();
      if (/CRISIS|NEGATIVE|DROUGHT|FIRE/.test(type)) return { type: 'negative', icon: '⚠️' };
      if (/WARNING|ALERT/.test(type)) return { type: 'warning', icon: '🔔' };
      if (/POSITIVE|RAIN|RECOVERY|SUCCESS/.test(type)) return { type: 'positive', icon: '✅' };
      return { type: 'neutral', icon: 'ℹ️' };
    }

    function appendText(parent, tag, text, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text || '';
      parent.appendChild(element);
      return element;
    }

    function showEventsState(message) {
      const feed = document.getElementById('events-feed');
      feed.replaceChildren();
      appendText(feed, 'div', message, 'no-events');
    }

    function renderEvents(filter = 'all') {
      const feed = document.getElementById('events-feed');
      const filtered = gameEvents.filter(event => {
        return filter === 'all' || eventPresentation(event.eventType).type === filter;
      });
      feed.replaceChildren();
      if (!filtered.length) {
        showEventsState('Nenhum evento real registrado para este filtro.');
        return;
      }

      filtered.forEach(event => {
        const presentation = eventPresentation(event.eventType);
        const card = document.createElement('article');
        card.className = 'event-card ' + presentation.type;
        const header = document.createElement('div');
        header.className = 'event-header';
        const title = document.createElement('div');
        title.className = 'event-title';
        appendText(title, 'span', presentation.icon, 'event-icon');
        appendText(title, 'h3', event.title || 'Evento da rodada');
        header.appendChild(title);
        appendText(header, 'span', formatDate(event.createdAt), 'event-date');
        card.appendChild(header);
        appendText(card, 'p', event.description || 'Sem descrição registrada.', 'event-description');
        if (event.impact) {
          const impact = document.createElement('div');
          impact.className = 'event-impact';
          appendText(impact, 'span', String(event.impact), 'impact-value ' + presentation.type);
          card.appendChild(impact);
        }
        feed.appendChild(card);
      });
    }

    function formatDate(value) {
      if (!value) return 'Data não registrada';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleDateString('pt-BR');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(item => item.classList.remove('active'));
        this.classList.add('active');
        renderEvents(this.getAttribute('data-filter'));
      });
    });

    document.addEventListener('DOMContentLoaded', function() {
      API.history.events(50)
        .then(result => {
          if (!result || result.success !== true) throw new Error((result && result.error) || 'Falha ao carregar eventos.');
          gameEvents = (result.data && result.data.events) || [];
          renderEvents('all');
        })
        .catch(error => showEventsState(error.message || 'Erro ao carregar eventos.'));
    });
  </script>
