  <script>
    function appendText(parent, tag, text, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text === undefined || text === null ? '' : String(text);
      parent.appendChild(element);
      return element;
    }

    function formatDate(value) {
      if (!value) return 'data não registrada';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleDateString('pt-BR');
    }

    function scalarMetrics(metrics) {
      return Object.entries(metrics || {})
        .filter(([, value]) => typeof value === 'number' || typeof value === 'string')
        .slice(0, 3);
    }

    function renderTimeline(records) {
      const timeline = document.getElementById('timeline');
      timeline.replaceChildren();
      if (!records.length) {
        appendText(timeline, 'p', 'Nenhuma rodada real foi registrada para este jogador.', 'timeline-description');
        return;
      }

      records.forEach(record => {
        const item = document.createElement('article');
        item.className = 'timeline-item';
        appendText(item, 'div', '💧', 'timeline-marker');
        const content = document.createElement('div');
        content.className = 'timeline-content';
        appendText(content, 'div', 'Rodada ' + record.round + ' · ' + formatDate(record.createdAt), 'timeline-date');
        appendText(content, 'h3', record.action || 'Decisão registrada', 'timeline-title');
        appendText(content, 'p', record.outcome || 'Resultado sem descrição.', 'timeline-description');

        const entries = scalarMetrics(record.metrics);
        if (entries.length) {
          const metrics = document.createElement('div');
          metrics.className = 'timeline-metrics';
          entries.forEach(([label, value]) => {
            const metric = document.createElement('div');
            metric.className = 'metric';
            appendText(metric, 'span', value, 'metric-value ' + (Number(value) < 0 ? 'down' : 'up'));
            appendText(metric, 'span', label, 'metric-label');
            metrics.appendChild(metric);
          });
          content.appendChild(metrics);
        }
        item.appendChild(content);
        timeline.appendChild(item);
      });
    }

    function showHistoryError(message) {
      const timeline = document.getElementById('timeline');
      timeline.replaceChildren();
      appendText(timeline, 'p', message || 'Erro ao carregar o histórico.', 'timeline-description');
    }

    document.addEventListener('DOMContentLoaded', function() {
      API.history.rounds(100)
        .then(result => {
          if (!result || result.success !== true) throw new Error((result && result.error) || 'Falha ao carregar histórico.');
          const data = result.data || {};
          const stats = data.stats || {};
          document.getElementById('total-rounds').textContent = stats.totalRounds || 0;
          document.getElementById('total-crises').textContent = stats.totalCrises || 0;
          document.getElementById('total-decisions').textContent = stats.totalDecisions || 0;
          document.getElementById('sustainability-score').textContent = (stats.sustainabilityScore || 0) + '%';
          renderTimeline(data.records || []);
        })
        .catch(error => showHistoryError(error.message));
    });
  </script>
